<dialog
        id="uploadDialog"
        class="sheet"
        aria-labelledby="uploadDialogTitle"
    >
        <div class="sheet__handle" aria-hidden="true"></div>

        <div class="sheet__header">
            <div>
                <p
                    class="eyebrow eyebrow--dark"
                    data-i18n="fromYourPerspective"
                >
                    Z Twojej perspektywy
                </p>

                <h2
                    id="uploadDialogTitle"
                    data-i18n="addToGallery"
                >
                    Dodaj do galerii
                </h2>
            </div>

            <button
                id="closeUploadButton"
                class="icon-button icon-button--small"
                type="button"
                data-i18n-aria-label="close"
                aria-label="Zamknij"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m6 6 12 12M18 6 6 18"/>
                </svg>
            </button>
        </div>

        <form id="uploadForm" novalidate>
            <label
                class="field-label"
                for="authorInput"
                data-i18n="yourName"
            >
                Twoje imię
            </label>

            <input
                id="authorInput"
                class="text-input"
                type="text"
                maxlength="80"
                autocomplete="name"
                data-i18n-placeholder="namePlaceholder"
                placeholder="np. Kasia"
            >

            <fieldset class="picker-fieldset">
                <legend data-i18n="choosePhoto">
                    Wybierz zdjęcie
                </legend>

                <div class="picker-grid">
                    <button
                        id="cameraButton"
                        class="picker-button"
                        type="button"
                    >
                        <span class="picker-button__icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 7h3l1.5-2h7L17 7h3v12H4V7Zm8 9a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
                            </svg>
                        </span>

                        <span data-i18n="takePhoto">
                            Zrób zdjęcie
                        </span>
                    </button>

                    <button
                        id="libraryButton"
                        class="picker-button"
                        type="button"
                    >
                        <span class="picker-button__icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 5h16v14H4V5Zm0 10 4.5-4.5 3.5 3.5 2-2 6 6M16.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/>
                            </svg>
                        </span>

                        <span data-i18n="chooseFromLibrary">
                            Wybierz z galerii
                        </span>
                    </button>
                </div>

                <input
                    id="cameraInput"
                    class="visually-hidden"
                    type="file"
                    accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
                    capture="environment"
                >

                <input
                    id="photoInput"
                    class="visually-hidden"
                    type="file"
                    accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
                    multiple
                >
            </fieldset>

            <div id="selectedPhoto" class="selected-photo" hidden>
                <div class="selected-photo__preview">
                    <img id="selectedPhotoPreview" alt="">

                    <div
                        id="previewFallback"
                        class="preview-fallback"
                        hidden
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 5h16v14H4V5Zm0 10 4.5-4.5 3.5 3.5 2-2 6 6"/>
                        </svg>
                    </div>
                </div>

                <div class="selected-photo__details">
                    <strong id="selectedPhotoName"></strong>
                    <span id="selectedPhotoSize"></span>
                </div>

                <button
                    id="removePhotoButton"
                    class="icon-button icon-button--small"
                    type="button"
                    data-i18n-aria-label="removePhoto"
                    aria-label="Usuń zdjęcie"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m6 6 12 12M18 6 6 18"/>
                    </svg>
                </button>
            </div>

            <div id="uploadProgress" class="upload-progress" hidden>
                <div class="upload-progress__track">
                    <span id="uploadProgressBar"></span>
                </div>

                <p
                    id="status"
                    role="status"
                    aria-live="polite"
                ></p>
            </div>

            <button
                id="uploadButton"
                class="primary-button"
                type="submit"
                disabled
            >
                <span data-i18n="sendPhoto">
                    Wyślij zdjęcie
                </span>

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h14m-5-5 5 5-5 5"/>
                </svg>
            </button>

            <p class="form-hint" data-i18n="fileHint">
                JPG, PNG, WebP lub HEIC · maks. 20 MB
            </p>
        </form>
    </dialog>
