<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#233b2c">
    <meta name="description" content="Wspólna galeria weselna Dawida i Macieja">

    <title>Dawid &amp; Maciej — galeria weselna</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/gallery.css">
    <link rel="stylesheet" href="./css/upload.css">
    <link rel="stylesheet" href="./css/lightbox.css">
    <link rel="stylesheet" href="./css/utilities.css">
    <link rel="stylesheet" href="./css/responsive.css">

    <script type="module" src="./js/main.js"></script>
</head>

<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero__topbar">
                <a
                    class="monogram"
                    href="#gallerySection"
                    aria-label="Dawid i Maciej"
                >
                    D <span aria-hidden="true">✦</span> M
                </a>

                <select
                    id="languageSelect"
                    class="language-select"
                    aria-label="Wybierz język / Choose language"
                >
                    <option value="pl">Polski</option>
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Français</option>
                    <option value="it">Italiano</option>
                    <option value="ru">Русский</option>
                    <option value="es">Español</option>
                    <option value="ar-DZ" dir="rtl">العربية (الجزائر)</option>
                </select>
            </div>

            <div class="hero__copy">
                <p class="eyebrow" data-i18n="weddingGallery">
                    Galeria weselna
                </p>

                <h1>
                    Dawid <span>&amp;</span> Maciej
                </h1>

                <p class="hero__lead" data-i18n="heroLead">
                    Zachowajmy ten dzień z każdej perspektywy.
                </p>
            </div>
        </header>

        <main id="appContent">
            <section class="upload-card" aria-labelledby="uploadCardTitle">
                <div class="upload-card__copy">
                    <p class="eyebrow eyebrow--dark" data-i18n="fromYourPerspective">
                        Z Twojej perspektywy
                    </p>

                    <h2 id="uploadCardTitle" data-i18n="addToGallery">
                        Dodaj do galerii
                    </h2>
                </div>

                <button
                    id="openUploadButton"
                    class="upload-trigger"
                    type="button"
                    disabled
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 13v6h14v-6"/>
                    </svg>

                    <span data-i18n="addPhoto">
                        Dodaj zdjęcie
                    </span>
                </button>
            </section>

            <section
                id="gallerySection"
                class="gallery-section"
                aria-labelledby="galleryTitle"
            >
                <div class="section-heading">
                    <div>
                        <p
                            class="eyebrow eyebrow--dark"
                            data-i18n="sharedMoments"
                        >
                            Wspólne chwile
                        </p>

                        <h2 id="galleryTitle" data-i18n="photos">
                            Zdjęcia
                        </h2>
                    </div>

                    <button
                        id="refreshButton"
                        class="icon-button"
                        type="button"
                        data-i18n-aria-label="refreshGallery"
                        aria-label="Odśwież galerię"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5m-5 4a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/>
                        </svg>
                    </button>
                </div>

                <p
                    id="galleryStatus"
                    class="gallery-status"
                    role="status"
                    aria-live="polite"
                ></p>

                <div id="gallery" class="gallery" aria-busy="true">
                    <div class="skeleton skeleton--tall"></div>
                    <div class="skeleton"></div>
                    <div class="skeleton"></div>
                    <div class="skeleton skeleton--tall"></div>
                </div>
            </section>
        </main>

        <section id="accessRequired" class="access-card" hidden>
            <div class="access-card__mark" aria-hidden="true">
                D <span>✦</span> M
            </div>

            <p
                class="eyebrow eyebrow--dark"
                data-i18n="privateGallery"
            >
                Prywatna galeria
            </p>

            <h2 data-i18n="scanQrTitle">
                Zeskanuj kod QR
            </h2>

            <p data-i18n="scanQrBody">
                Dostęp do galerii otrzymasz z zaproszenia dostępnego na weselu.
            </p>
        </section>
    </div>

    <div id="dialogMount"></div>

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
        hidden
    ></div>

    <noscript>
        <div class="noscript">
            Ta galeria wymaga włączonego JavaScript.
        </div>
    </noscript>
</body>
</html>
